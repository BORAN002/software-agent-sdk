---
name: Grep Windows validation
on:
    push:
        branches: [ci/grep-regex-windows]
permissions:
    contents: read
jobs:
    windows:
        runs-on: windows-latest
        timeout-minutes: 15
        env:
            PYTHONUTF8: '1'
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v6
              with:
                  python-version: '3.13'
            - name: Compare argument and stdin pattern transport
              run: python .pr/probe_windows_grep.py
